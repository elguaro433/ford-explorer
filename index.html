<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ford Explorer C9389</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Explorer">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1f5f4a">
<meta name="claude:viewport-fit-sides" content="cover">
<meta http-equiv="Cache-Control" content="no-cache">
<meta http-equiv="Pragma" content="no-cache">
<style>
  /* Una columna pensada para el móvil; en pantallas grandes se centra a 760 px. */
  :root {
    --bg: #f5f4ef; --card: #ffffff; --text: #1d2321; --muted: #5f6a65; --line: #e2e0d8;
    --brand: #1f5f4a; --brand-soft: #e3efe9; --warn: #8f5100; --warn-soft: #fff1dc;
    --bad: #b3261e; --bad-soft: #fde7e5; --ok: #1f7a46; --ok-soft: #e2f4e8;
    --head: #1f5f4a; --on-head: #ffffff; --tab-on: #ffffff; --tab-on-text: #1f5f4a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141816; --card: #1d2320; --text: #e8ece9; --muted: #a3ada8; --line: #2e3632;
      --brand: #6fc3a3; --brand-soft: #1f3a30; --warn: #f0b35a; --warn-soft: #3a2c14;
      --bad: #ff8a80; --bad-soft: #3d1d1b; --ok: #79d39f; --ok-soft: #1a3526;
      --head: #183a2f; --tab-on: #e8ece9; --tab-on-text: #183a2f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141816; --card: #1d2320; --text: #e8ece9; --muted: #a3ada8; --line: #2e3632;
    --brand: #6fc3a3; --brand-soft: #1f3a30; --warn: #f0b35a; --warn-soft: #3a2c14;
    --bad: #ff8a80; --bad-soft: #3d1d1b; --ok: #79d39f; --ok-soft: #1a3526;
    --head: #183a2f; --tab-on: #e8ece9; --tab-on-text: #183a2f; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  header { background: var(--head); color: var(--on-head); }
  header .pad { max-width: 760px; margin: 0 auto; padding-block: 14px 12px; }
  header h1 { margin: 0; font-size: 21px; line-height: 1.2; }
  header .sub { margin: 4px 0 0; font-size: 13px; opacity: .85; }
  nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  nav button { background: rgba(255,255,255,.12); border: 0; color: var(--on-head); padding: 10px 2px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 44px; }
  nav button.on { background: var(--tab-on); color: var(--tab-on-text); }
  @media (min-width: 700px) { nav { grid-template-columns: repeat(8, 1fr); } nav button { font-size: 14px; } }
  .total { display: flex; justify-content: space-between; font-weight: 700; padding-top: 10px; }
  .foto-anuncio { display: block; width: 100%; border-radius: 10px; margin-bottom: 10px; }

  main { max-width: 760px; margin: 0 auto; padding-block: 16px 40px; }
  section { display: none; } section.on { display: block; }
  h2 { font-size: 18px; margin: 22px 0 10px; text-wrap: balance; }
  .intro { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  a { color: var(--brand); }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .kpi span { display: block; color: var(--muted); font-size: 13px; }
  .kpi strong { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .tel { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--text); text-decoration: none; }
  .tel:last-child { border-bottom: 0; }
  .tel strong { flex: 0 0 auto; font-size: 18px; color: var(--bad); font-variant-numeric: tabular-nums; }
  .tel span { flex: 1; min-width: 0; font-size: 15px; }
  .tel small { display: block; color: var(--muted); font-size: 13px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; margin-bottom: 10px; }
  .btn.prim { background: var(--brand); border-color: var(--brand); color: var(--bg); }
  .btn.sos { background: var(--bad); border-color: var(--bad); color: #fff; font-size: 18px; min-height: 56px; }
  .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fila2 .btn { margin-bottom: 0; }
  .campo { display: block; margin-bottom: 10px; font-size: 14px; color: var(--muted); }
  .campo input { display: block; width: 100%; margin-top: 4px; font: inherit; font-size: 18px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); }
  .campo.chk { display: flex; gap: 10px; align-items: center; color: var(--text); font-size: 16px; }
  .campo.chk input { width: 22px; height: 22px; margin: 0; accent-color: var(--brand); }
  .lleno { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .lleno:last-child { border-bottom: 0; }
  .lleno .f { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lleno .r { text-align: right; font-variant-numeric: tabular-nums; }
  .lleno .x { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
  .lleno button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; padding: 6px 0 0; text-decoration: underline; justify-self: start; }
  .paso { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .paso:last-child { border-bottom: 0; }
  .paso input { width: 24px; height: 24px; margin: 2px 0 0; flex: none; accent-color: var(--ok); }
  .paso.done > div { opacity: .55; }
  .paso small { display: block; color: var(--muted); font-size: 14px; }
  .paso a { font-weight: 700; }
  .misdatos { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; margin: 6px 0 10px; white-space: pre-line; }
  .alert { border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .alert b { display: block; }
  .alert small { display: block; color: var(--text); opacity: .85; font-size: 14px; }
  .alert.bad { background: var(--bad-soft); color: var(--bad); }
  .alert.warn { background: var(--warn-soft); color: var(--warn); }
  .alert.ok { background: var(--ok-soft); color: var(--ok); }

  .todo { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .todo:last-child { border-bottom: 0; }
  .todo input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--brand); }
  .todo.done span { text-decoration: line-through; color: var(--muted); }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 99px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; min-height: 40px; }
  .chip.on { background: var(--brand); border-color: var(--brand); color: var(--bg); }
  select, input[type=search] { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); margin-bottom: 12px; }

  details { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  summary { padding: 13px 14px; cursor: pointer; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: flex-start; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "›"; color: var(--brand); font-size: 20px; line-height: 1.1; transition: transform .15s; flex: none; }
  details[open] > summary::before { transform: rotate(90deg); }
  summary .pg { font-weight: 400; color: var(--muted); font-size: 13px; white-space: nowrap; }
  details > div { padding: 0 14px 14px; }
  details ol, details ul { margin: 4px 0 8px; padding-left: 22px; }
  details li { margin-bottom: 4px; }
  .grupo > summary { font-size: 17px; }

  .botones { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 600px) { .botones { grid-template-columns: repeat(4, 1fr); } }
  .boton { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 8px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 12px; font: inherit; font-size: 14px; line-height: 1.3; cursor: pointer; text-align: center; min-width: 0; }
  .boton img { width: 100%; height: 96px; object-fit: contain; background: #fff; border-radius: 8px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 10;
    padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
  @media (min-width: 600px) { .modal { align-items: center; } }
  .modal .card { position: relative; max-width: 520px; width: 100%; max-height: 88vh; overflow: auto; margin: 0; padding: 16px; }
  .modal img { display: block; max-width: 100%; max-height: 220px; margin: 0 auto 8px; background: #fff; border-radius: 8px; padding: 6px; }
  .modal h3 { margin: 4px 44px 8px 0; font-size: 19px; }
  .modal p { margin: 0 0 10px; }
  .cerrar { position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; background: var(--bg); border: 1px solid var(--line); border-radius: 50%; color: var(--text); font-size: 18px; cursor: pointer; }

  .dibujos { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
  .dibujos img.grande { width: 100%; max-height: none; }
  .dibujos figure { position: relative; margin: 0; max-width: 100%; }
  .dibujos figcaption { position: absolute; top: 6px; left: 6px; width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: var(--bg); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
  .dibujos img { display: block; max-width: 100%; max-height: 200px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 4px; }

  .fus { display: grid; grid-template-columns: 44px 70px 1fr; gap: 8px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .fus:last-child { border-bottom: 0; }
  .fus .num { font-variant-numeric: tabular-nums; }
  .fus .amp { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .fus .amp i { display: block; font-style: normal; font-size: 12px; }
  .fus.libre { color: var(--muted); }
  #fusQue { margin: 8px 0; }
  .sub-h { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--brand); margin: 14px 0 2px; }
  .sub-h:first-child { margin-top: 0; }
  .dato { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .dato:last-child { border-bottom: 0; }
  .dato span { display: block; font-size: 13px; color: var(--muted); }
  .ev { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .ev:last-child { border-bottom: 0; }
  .ev .f { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ev.malo b { color: var(--bad); }
  .ev .d { font-size: 14px; color: var(--muted); }
  .doc { display: block; padding: 10px 0; border-bottom: 1px solid var(--line); word-break: break-word; }
  .doc:last-child { border-bottom: 0; }

  .hit { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .hit:last-child { border-bottom: 0; }
  .hit .tag { font-size: 12px; color: var(--muted); }
  mark { background: #ffe58a; color: #000; border-radius: 3px; }
</style>
</head>
<body>
<header>
  <div class="pad">
    <h1>Ford Explorer · C9389</h1>
    <p class="sub">Propiedad de Emmanuel Díaz · Creado por Emmanuel Díaz</p>
    <p class="sub">XLT 4x4 · 4.0 V6 gasolina · verde · 1995</p>
    <nav id="tabs" aria-label="Secciones"></nav>
  </div>
</header>
<main class="pad">
  <section id="inicio"></section>
  <section id="gasolina"></section>
  <section id="buscar">
    <input type="search" id="q" placeholder="Ej.: fusible radio, 4x4, aceite…" autocomplete="off" aria-label="Buscar">
    <div id="res"></div>
  </section>
  <section id="sirve"></section>
  <section id="fallos"></section>
  <section id="manual"></section>
  <section id="coche"></section>
  <section id="compra"></section>
</main>
<div id="detalleBoton"></div>

<!-- Cambiar el número de v= en cada publicación para que el móvil no use la versión guardada -->
<script src="datos.js?v=16"></script>
<script src="manual.js?v=16"></script>
<script src="imagenes.js?v=16"></script>
<script src="botones.js?v=16"></script>
<script src="fusibles.js?v=16"></script>
<script src="archivos.js?v=16" onerror="this.remove()"></script>
<script>
const D = window.DATOS, M = window.MANUAL || [], IMG = window.IMAGENES || {}, B = window.BOTONES || [];
const HOY = new Date();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtF = iso => iso.split("-").reverse().join("/");
const km = n => n == null ? "" : n.toLocaleString("es-ES") + " km";
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
// En el PC los documentos están una carpeta más arriba; en la web van en docs/
const LOCAL = location.protocol === "file:" || location.port === "8765";
const DOCS = LOCAL ? "../" : "docs/";

const store = {
  get(k, def) { try { const v = localStorage.getItem("fe_" + k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v) { try { localStorage.setItem("fe_" + k, JSON.stringify(v)); } catch {} }
};
let hechos = store.get("hechos", {});

const dibujos = titulo => (IMG[titulo] || []).length
  ? `<div class="dibujos">${IMG[titulo].map((n, i, a) => `<figure>${a.length > 2 ? `<figcaption>${i + 1}</figcaption>` : ""}<img src="img/${n}.jpg" alt="" loading="lazy"></figure>`).join("")}</div>` : "";

// ---------- Pestañas ----------
const TABS = [["inicio", "Inicio"], ["gasolina", "Gasolina"], ["buscar", "Buscar"], ["sirve", "Botones"], ["fallos", "Problemas"], ["manual", "Manual"], ["coche", "Mi coche"], ["compra", "Mi compra"]];
$("#tabs").innerHTML = TABS.map(([id, t]) => `<button data-t="${id}">${t}</button>`).join("");
function abrir(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === id));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === id));
  try { localStorage.setItem("fe_tab", id); } catch {}
  scrollTo(0, 0);
}
$("#tabs").onclick = e => { const b = e.target.closest("button"); if (b) abrir(b.dataset.t); };

// ---------- Ventana (accidente) ----------
function ventana(titulo, html, alAbrir) {
  $("#detalleBoton").innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><div class="card">
    <button class="cerrar" aria-label="Cerrar">✕</button><h3>${esc(titulo)}</h3>${html}</div></div>`;
  const cerrar = () => $("#detalleBoton").innerHTML = "";
  $("#detalleBoton .cerrar").onclick = cerrar;
  $("#detalleBoton .modal").onclick = e => { if (e.target.classList.contains("modal")) cerrar(); };
  if (alAbrir) alAbrir($("#detalleBoton .card"));
}

// ---------- Accidente, paso a paso ----------
const tel = n => `<a href="tel:${n.replace(/\s/g, "")}">${esc(n)}</a>`;
const MIS_DATOS = () => `Conductor y tomador: Emmanuel [nombre]
Coche: Ford Explorer XLT 4x4, verde · Matrícula C9389 (Andorra)
Seguro: Multisegur Assegurances · Póliza ${D.seguro.poliza}
Válido del ${fmtF(D.seguro.desde)} al ${fmtF(D.seguro.hasta)} · Agente: ${D.seguro.agente}`;
const PASOS = [
  ["Para en sitio seguro y pon los warning", "Ponte el chaleco reflectante ANTES de bajar del coche."],
  ["¿Alguien herido? Llama al 112", "No muevas a los heridos (salvo peligro de fuego). " + "112 = emergencias en Andorra y en toda Europa."],
  ["Pon los triángulos", "Unos 50 m por detrás, donde se vean bien. Si no es seguro bajarte, no lo hagas."],
  ["Haz fotos", "Los dos coches enteros, las matrículas, los golpes de cerca, la carretera, las señales y el carnet y el seguro del otro."],
  ["Rellena el parte amistoso con el otro conductor", "Un solo parte, firmado por los dos. Si no estás de acuerdo con lo que pone, no firmes y llama a la policía (110 en Andorra)."],
  ["Si el coche no anda: grúa", "Asistencia Multisegur: en Andorra " + "+376 860 366" + ", fuera de Andorra " + "+34 933 001 050" + "."],
  ["Avisa al seguro", "Multisegur +376 808 808 (o WhatsApp +376 626 808), en los próximos días. Guarda el parte y las fotos."]
];
let pasosHechos = {};
function verAccidente() {
  const pinta = () => PASOS.map(([t, d], i) => `<label class="paso ${pasosHechos[i] ? "done" : ""}"><input type="checkbox" data-i="${i}" ${pasosHechos[i] ? "checked" : ""}><div><b>${i + 1}. ${esc(t)}</b><small>${esc(d).replace(/(\+\d[\d ]{6,}\d|\b11[0268]\b)/g, m => tel(m))}</small></div></label>`).join("");
  ventana("Accidente: paso a paso", `
    <a class="btn sos" href="tel:112">📞 Llamar al 112</a>
    <div id="pasos">${pinta()}</div>
    <h3 style="margin-top:14px">Mis datos para el parte</h3>
    <div class="misdatos">${esc(MIS_DATOS())}</div>
    <div class="fila2"><button class="btn" id="copiarDatos">📋 Copiar</button><button class="btn" id="limpiarPasos">↺ Empezar de nuevo</button></div>`, card => {
    const enganchar = () => card.querySelectorAll("#pasos input").forEach(c => c.onchange = () => {
      pasosHechos[c.dataset.i] = c.checked; card.querySelector("#pasos").innerHTML = pinta(); enganchar();
    });
    enganchar();
    card.querySelector("#copiarDatos").onclick = async e => {
      try { await navigator.clipboard.writeText(MIS_DATOS()); e.target.textContent = "✓ Copiado"; } catch { e.target.textContent = "No se pudo copiar"; }
    };
    card.querySelector("#limpiarPasos").onclick = () => { pasosHechos = {}; card.querySelector("#pasos").innerHTML = pinta(); enganchar(); };
  });
}

// ---------- Mecánico ----------
function textoMecanico() {
  const F = Object.fromEntries(D.ficha.map(([k, v]) => [k, v]));
  return [
    "Ford Explorer C9389 (Andorra)",
    F["Modelo"] + " · " + F["Fabricado"],
    "Bastidor: " + F["Bastidor (VIN)"],
    "Motor: " + F["Motor"],
    "Cambio: " + F["Cambio"] + " · " + F["Tracción"],
    "Kilómetros: " + kmHoy().toLocaleString("es-ES"),
    "",
    "Aceite motor: " + F["Aceite del motor"],
    "Cambio automático: " + F["Aceite del cambio automático"],
    "Caja transfer: " + F["Caja transfer"],
    "Ejes: " + F["Eje delantero / trasero"],
    "Refrigerante: " + F["Refrigerante"],
    "Líquido de frenos: " + F["Líquido de frenos"],
    "Neumáticos: " + F["Neumáticos"],
    "Faros: " + F["Bombilla de los faros"],
    "",
    "Pendiente: " + D.pendientes.filter(p => !hechos[p.id]).map(p => p.t).join("; ")
  ].join("\n");
}
async function mandarMecanico() {
  const t = textoMecanico();
  if (navigator.share) { try { await navigator.share({ text: t }); return; } catch (e) { if (e.name === "AbortError") return; } }
  location.href = "https://wa.me/?text=" + encodeURIComponent(t);
}

// ---------- Gasolina ----------
// Cada repostaje: { id, f: "AAAA-MM-DD", km, l, eur, lleno }. Se guarda en el móvil.
let llenos = store.get("gasolina", []);
const guardarLlenos = () => store.set("gasolina", llenos);
const num = v => { const n = parseFloat(String(v).replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : null; };
const n1 = (n, d = 1) => n.toLocaleString("es-ES", { minimumFractionDigits: d, maximumFractionDigits: d });
const eur = n => n1(n, 2) + " €";
function kmHoy() { return Math.max(D.estado.kmActual, ...llenos.map(r => r.km)); }
function calcLlenos() {
  const L = llenos.slice().sort((a, b) => a.km - b.km || a.f.localeCompare(b.f));
  let prev = null, ultLleno = null, litrosDesde = 0;
  for (const r of L) {
    r.dist = prev ? r.km - prev.km : null;
    litrosDesde += r.l;
    r.cons = null;
    if (r.lleno) {
      if (ultLleno && r.km > ultLleno.km) { r.cons = litrosDesde / (r.km - ultLleno.km) * 100; r.tramo = r.km - ultLleno.km; }
      ultLleno = r; litrosDesde = 0;
    }
    prev = r;
  }
  return L;
}
function pintarGasolina() {
  const L = calcLlenos();
  const conCons = L.filter(r => r.cons != null);
  const kmTramos = conCons.reduce((s, r) => s + r.tramo, 0);
  const litTramos = conCons.reduce((s, r) => s + r.cons * r.tramo / 100, 0);
  const media = kmTramos ? litTramos / kmTramos * 100 : null;
  const precioMedio = L.length ? L.reduce((s, r) => s + r.eur, 0) / L.reduce((s, r) => s + r.l, 0) : null;
  const hoy = new Date().toISOString().slice(0, 10);
  const gasto = pref => L.filter(r => r.f.startsWith(pref)).reduce((s, r) => s + r.eur, 0);
  const kmAno = (() => { const a = L.filter(r => r.f.startsWith(hoy.slice(0, 4))); return a.length > 1 ? a.at(-1).km - a[0].km : 0; })();
  const ult = L.at(-1);
  $("#gasolina").innerHTML = `
    <h2 style="margin-top:0">Apuntar repostaje</h2>
    <div class="card">
      <label class="campo">Kilómetros del cuentakilómetros
        <input id="gKm" inputmode="numeric" placeholder="${ult ? "Último: " + ult.km.toLocaleString("es-ES") : "Ej.: " + kmHoy()}" autocomplete="off"></label>
      <div class="fila2">
        <label class="campo">Precio €/L<input id="gP" inputmode="decimal" placeholder="${ult && ult.p ? "Último: " + n1(ult.p, 3) : "Ej.: 1,548"}" autocomplete="off"></label>
        <label class="campo">Euros del ticket<input id="gE" inputmode="decimal" placeholder="Ej.: 85,20" autocomplete="off"></label>
      </div>
      <label class="campo">Litros <span id="gLauto"></span><input id="gL" inputmode="decimal" placeholder="Se calcula con el precio y los euros" autocomplete="off"></label>
      <div class="fila2">
        <label class="campo">Fecha<input id="gF" type="date" value="${hoy}"></label>
        <label class="campo chk" style="margin-top:22px"><input id="gLleno" type="checkbox" checked>Depósito lleno</label>
      </div>
      <p class="muted" id="gAviso" style="margin:0 0 8px"></p>
      <button class="btn prim" id="gGuardar">Guardar</button>
      <p class="muted" style="margin:0">Para saber cuánto gasta, llena el depósito del todo cada vez (o marca «lleno» solo cuando lo llenes).</p>
    </div>

    <h2>Resumen</h2>
    <div class="kpis">
      <div class="kpi"><span>Gasta de media</span><strong>${media ? n1(media) + " L/100" : "—"}</strong></div>
      <div class="kpi"><span>Cuesta cada 100 km</span><strong>${media && precioMedio ? eur(media * precioMedio) : "—"}</strong></div>
      <div class="kpi"><span>Gasolina este mes</span><strong>${eur(gasto(hoy.slice(0, 7)))}</strong></div>
      <div class="kpi"><span>Gasolina este año</span><strong>${eur(gasto(hoy.slice(0, 4)))}</strong></div>
      <div class="kpi"><span>Km este año</span><strong>${kmAno.toLocaleString("es-ES")}</strong></div>
      <div class="kpi"><span>Precio medio</span><strong>${precioMedio ? n1(precioMedio, 3) + " €/L" : "—"}</strong></div>
    </div>
    ${L.length && !media ? `<p class="muted">La media sale a partir del segundo depósito lleno.</p>` : ""}

    <h2>Repostajes</h2>
    <div class="card">${L.length ? L.slice().reverse().map(r => `
      <div class="lleno">
        <div><div class="f">${fmtF(r.f)} · ${r.km.toLocaleString("es-ES")} km</div><b>${r.dist != null ? "+" + r.dist.toLocaleString("es-ES") + " km desde el anterior" : "Primer repostaje"}</b></div>
        <div class="r"><b>${eur(r.eur)}</b><div class="f">${n1(r.l, 2)} L · ${n1(r.eur / r.l, 3)} €/L</div></div>
        <div class="x">${r.lleno ? "Lleno" : "No lleno"}${r.cons != null ? ` · <b>${n1(r.cons)} L/100 km</b> en ${r.tramo.toLocaleString("es-ES")} km` : ""}</div>
        <button data-borrar="${r.id}">Borrar</button>
      </div>`).join("") : `<p class="muted" style="margin:0">Aún no hay ninguno. Apunta el próximo cuando eches gasolina.</p>`}</div>
    ${L.length ? `<button class="btn" id="gCopia">📋 Copiar copia de seguridad</button>` : ""}`;

  // Con dos de los tres (precio, euros, litros) se calcula el que falta
  const orden = [];
  const CAMPOS = { gP: 3, gE: 2, gL: 2 };
  Object.keys(CAMPOS).forEach(id => $("#" + id).oninput = () => {
    const i = orden.indexOf(id); if (i >= 0) orden.splice(i, 1); orden.push(id);
    const dos = orden.filter(k => num($("#" + k).value)).slice(-2);
    if (dos.length < 2) return;
    const falta = Object.keys(CAMPOS).find(k => !dos.includes(k));
    const P = num($("#gP").value), E = num($("#gE").value), Lt = num($("#gL").value);
    const v = falta === "gL" ? E / P : falta === "gE" ? P * Lt : E / Lt;
    if (!isFinite(v) || v <= 0) return;
    $("#" + falta).value = n1(v, CAMPOS[falta]).replace(/\./g, "");
    $("#gLauto").textContent = falta === "gL" ? "(calculados)" : "";
  });

  $("#gGuardar").onclick = () => {
    const kmV = num($("#gKm").value), l = num($("#gL").value), e = num($("#gE").value), f = $("#gF").value || hoy;
    const av = $("#gAviso");
    if (!kmV || !l || !e) { av.textContent = "Rellena kilómetros, litros y euros."; return; }
    if (l > 90) { av.textContent = "El depósito es de 83 litros: revisa los litros."; return; }
    const antes = calcLlenos().filter(r => r.f <= f).at(-1);
    if (antes && kmV < antes.km && !av.dataset.ok) { av.textContent = `Ojo: son menos km que el anterior (${antes.km.toLocaleString("es-ES")}). Pulsa Guardar otra vez si está bien.`; av.dataset.ok = 1; return; }
    llenos.push({ id: Date.now().toString(36), f, km: Math.round(kmV), l, eur: e, p: Math.round(e / l * 1000) / 1000, lleno: $("#gLleno").checked });
    guardarLlenos(); pintarGasolina(); pintarInicio();
  };
  $("#gasolina").querySelectorAll("[data-borrar]").forEach(b => b.onclick = () => {
    if (!confirm("¿Borrar este repostaje?")) return;
    llenos = llenos.filter(r => r.id !== b.dataset.borrar); guardarLlenos(); pintarGasolina(); pintarInicio();
  });
  const cp = $("#gCopia");
  if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(JSON.stringify(llenos)); cp.textContent = "✓ Copiada (pégala en Notas)"; } catch { cp.textContent = "No se pudo copiar"; } };
}

function avisos() {
  const a = [];
  const dias = Math.ceil((new Date(D.estado.proximaITV) - HOY) / 864e5);
  if (dias < 0) a.push(["bad", "ITV caducada", `Vencía el ${fmtF(D.estado.proximaITV)}.`]);
  else a.push([dias <= 90 ? "warn" : "ok", `ITV en ${dias} días`, `Antes del ${fmtF(D.estado.proximaITV)}, con la fuga de la transmisión reparada.`]);
  if (!hechos.segundaLlave) a.push(["bad", "Solo tienes una llave y un mando", "Sin el mando el coche no arranca. Haz una copia."]);
  if (!hechos.aceite) a.push(["bad", "Toca cambiar el aceite", `El último cambio fue en ${D.estado.ultimoAceite.fecha.slice(0, 4)} a ${km(D.estado.ultimoAceite.km)}. Ya pasa de ${km(D.estado.ultimoAceite.proximoKm)}.`]);
  if (!hechos.liqfrenos) a.push(["warn", "Revisar frenos", "Líquido sin cambiar desde hace años y el freno delantero derecho frena un 10 % menos."]);
  const mz = new Date(HOY.getMonth() < 2 ? HOY.getFullYear() : HOY.getFullYear() + 1, 2, 1);
  const dm = Math.ceil((mz - HOY) / 864e5);
  if (dm <= 45) a.push(["warn", `Impuesto de circulación en ${dm} días`, "169,50 € en marzo. Se cobra solo de la cuenta de MoraBanc: que haya saldo."]);
  return a;
}

function indice() {
  const I = [];
  D.faq.forEach(([p, r]) => I.push({ tag: "Pregunta", t: p, d: r }));
  B.forEach(b => I.push({ tag: "Botón o luz · pág. " + b.p, t: b.n, d: b.s + " " + b.u }));
  D.fallos.forEach(f => I.push({ tag: "Problema · pág. " + f.p, t: f.s, d: f.c.join(" ") }));
  M.forEach(m => I.push({ tag: "Manual · pág. " + m.p, t: m.t, d: m.x }));
  D.ficha.forEach(([k, v, g]) => I.push({ tag: "Ficha · " + g, t: k + ": " + v, d: "" }));
  D.pendientes.forEach(p => I.push({ tag: "Tarea", t: p.t, d: "" }));
  if (window.FUSIBLES) {
    const F = window.FUSIBLES;
    F.rapidos.forEach(([q, f]) => I.push({ tag: "Fusible", t: "No funciona: " + q, d: "Mira el fusible: " + f }));
    [F.dentro, F.motor].forEach(c => c.lista.filter(x => x[1]).forEach(([n, a, , q]) => I.push({ tag: "Fusible · " + c.nombre, t: `Fusible ${n} (${String(a).replace(".", ",")} A)`, d: q })));
  }
  return I;
}
const VACIAS = new Set("el la los las de del un una que en y a o con por para se su sus mi es al lo le como cual cuando cuanto cuanta donde hay tiene tengo lleva llevar lleve pongo poner hace hacer cada".split(" "));
function buscar() {
  const q = $("#q").value.trim();
  const palabras = norm(q).split(/[^a-z0-9ñ]+/).filter(w => w.length > 1 && !VACIAS.has(w));
  if (!palabras.length) { $("#res").innerHTML = `<p class="intro">Escribe una palabra o una pregunta: <i>¿qué aceite lleva?</i>, <i>frenos</i>, <i>fusible</i>, <i>alarma</i>…</p>`; return; }
  const raiz = w => w.length > 5 ? w.slice(0, -2) : w;
  const hits = indice().map(it => {
    const txt = norm(it.tag + " " + it.t + " " + it.d), tit = norm(it.t);
    let s = 0; palabras.forEach(w => { const r = raiz(w); if (txt.includes(r)) s += tit.includes(r) ? 3 : 1; });
    if (it.tag === "Pregunta") s *= 1.3;
    return [s, it];
  }).filter(([s]) => s > 0).sort((a, b) => b[0] - a[0]).slice(0, 20);
  const marcar = s => { let h = esc(s); palabras.forEach(w => { const r = raiz(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); h = h.replace(new RegExp("(" + r + ")", "gi"), "<mark>$1</mark>"); }); return h; };
  $("#res").innerHTML = hits.length
    ? `<div class="card">${hits.map(([, it]) => `<div class="hit"><div class="tag">${esc(it.tag)}</div><b>${marcar(it.t)}</b>${it.d ? `<div class="muted">${marcar(it.d)}</div>` : ""}</div>`).join("")}</div>`
    : `<p class="intro">No hay nada sobre «${esc(q)}». Prueba con otra palabra.</p>`;
}
$("#q").oninput = buscar;

    <details class="grupo"><summary>Ficha del coche</summary><div>
      ${[...new Set(D.ficha.map(f => f[2]))].map(g => `<h3 class="sub-h">${esc(g)}</h3>
        ${D.ficha.filter(f => f[2] === g).map(([k, v]) => `<div class="dato"><span>${esc(k)}</span>${esc(v)}</div>`).join("")}`).join("")}</div></details>

    <details class="grupo"><summary>Mantenimiento</summary><div>
      <div class="alert warn"><b>Lo que le toca ahora</b><small>${esc(P.tuEstado)}</small></div>
      <p>${esc(P.resumen)}</p>
      ${P.tareas.map(([c, t]) => `<div class="dato"><span>${esc(c)}</span>${esc(t)}</div>`).join("")}
      <h2>Lo que se le ha hecho</h2>
      ${hecho.map(e => `<div class="ev"><div class="f">${fmtF(e.f)}${e.km ? " · " + km(e.km) : ""}</div><b>${esc(e.t)}</b>${e.d ? `<div class="d">${esc(e.d)}</div>` : ""}</div>`).join("")}
    </div></details>

    <details class="grupo"><summary>Historial (ITV, papeles, compra)</summary><div>
      ${hist.map(e => `<div class="ev ${/DESFAV|CONDIC/.test(e.t) ? "malo" : ""}"><div class="f">${fmtF(e.f)}${e.km ? " · " + km(e.km) : ""}</div><b>${esc(e.t)}</b>${e.d ? `<div class="d">${esc(e.d)}</div>` : ""}</div>`).join("")}
    </div></details>

    <h2>Papeles y fotos</h2>
    ${docs}`;
}

// ---------- Mi compra ----------
function pintarCompra() {
  const C = D.compra, A = C.anuncio;
  const total = C.pagos.reduce((s, p) => s + p[2], 0);
  const eur = n => n.toLocaleString("es-ES") + " €";
  $("#compra").innerHTML = `
    <div class="card">${C.resumen.map(([k, v]) => `<div class="dato"><span>${esc(k)}</span>${esc(v)}</div>`).join("")}</div>

    <h2>Cómo fue</h2>
    <div class="card">${C.pasos.map(([f, t, d]) => `<div class="ev"><div class="f">${fmtF(f)}</div><b>${esc(t)}</b><div class="d">${esc(d)}</div></div>`).join("")}</div>

    <h2>Pagos</h2>
    <div class="card">${C.pagos.map(([f, t, n]) => `<div class="ev"><div class="f">${fmtF(f)}</div>${esc(t)}: <b>${eur(n)}</b></div>`).join("")}
      <div class="total"><span>Total</span><span>${eur(total)}</span></div></div>

    <h2>El anuncio</h2>
    <div class="card">
      <img class="foto-anuncio" src="${DOCS}${encodeURI(A.foto)}" alt="Anuncio del Ford Explorer en Wallapop" loading="lazy">
      <b>${esc(A.titulo)}</b>
      <p class="muted" style="margin:4px 0 8px">${esc(A.texto)}</p>
      <a href="${A.url}" target="_blank" rel="noopener">Ver el anuncio en Wallapop</a>
    </div>`;
}

function pintarTodo() { pintarInicio(); pintarGasolina(); pintarSirve(); pintarFallos(); pintarManual(); pintarCoche(); pintarCompra(); buscar(); }
pintarTodo();
let t0 = "inicio"; try { t0 = localStorage.getItem("fe_tab") || "inicio"; } catch {}
abrir(TABS.some(t => t[0] === t0) ? t0 : "inicio");

// Sin cobertura: lo guarda todo en el móvil la primera vez que se abre con internet
if ("serviceWorker" in navigator && isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
